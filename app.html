<div class="app-window" id="EightBallApp">
  <div class="app-header"><span class="app-title">🎱 Magic 8-Ball</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="wrap" style="align-items:center;text-align:center">
      <div id="eb-ball" style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111);display:flex;align-items:center;justify-content:center;color:#cfe3ff;font-weight:700;padding:16px;font-size:14px">Ask away...</div>
      <input id="eb-q" placeholder="Will it work out?" style="width:90%">
      <button id="eb-go">Ask the ball</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
